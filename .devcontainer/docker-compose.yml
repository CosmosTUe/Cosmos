services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
      - mailpit

  # same major version as production (Cosmos-Prod runs PostgreSQL 17)
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmos_website_tester
      POSTGRES_PASSWORD: '2020123'
      POSTGRES_DB: cosmos_website_test
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # catches every email the site sends; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  postgres_data:
