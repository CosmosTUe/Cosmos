services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bullseye
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
  
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmos_website_tester
      POSTGRES_PASSWORD: '2020123'
      POSTGRES_DB: cosmos_website_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  postgres_data: