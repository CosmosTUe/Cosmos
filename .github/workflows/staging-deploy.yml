name: Staging Deployment Workflow
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub sign in to Azure without a stored password
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: COSMOS-RESOURCE-GROUP
  VM_NAME: Cosmos-Staging-Next

jobs:
  # the same checks as on pull requests; the deploy only runs if all three pass
  format:
    uses: ./.github/workflows/format.yml
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml

  deploy_job:
    needs: [format, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: start the staging server if it is off
        run: |
          state=$(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)
          echo "staging server is: $state"
          if [ "$state" != "PowerState/running" ]; then az vm start -g "$RESOURCE_GROUP" -n "$VM_NAME"; fi
      - name: wait until the staging server accepts SSH
        run: |
          for i in $(seq 1 30); do
            if nc -z -w 5 "${{ secrets.STAGING_HOST }}" "${{ secrets.STAGING_PORT }}"; then exit 0; fi
            sleep 10
          done
          echo "staging server did not come up"; exit 1
      - name: deploy to staging server with ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          command_timeout: 30m
          script: |
            set -e  # stop at the first failing command (ssh-action dropped script_stop)
            sudo -u cosmos sh ~/deploy.sh
            sudo systemctl restart gunicorn nginx
      - name: check status code
        run: |
          sleep 10
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --user "${{ secrets.STAGING_BASIC_AUTH }}" -o /dev/null -w "https://staging.cosmostue.nl/ -> %{http_code}\n" "https://staging.cosmostue.nl/"
