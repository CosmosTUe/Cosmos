name: Stop Staging Server
on:
  workflow_dispatch: # the "Stop staging" button in the Actions tab
  schedule:
    - cron: "*/15 * * * *" # checks every 15 minutes; stops staging after 2 idle hours

permissions:
  id-token: write # lets GitHub sign in to Azure without a stored password
  actions: read
  contents: read

concurrency:
  group: staging-stop
  cancel-in-progress: false

env:
  RESOURCE_GROUP: COSMOS-RESOURCE-GROUP
  VM_NAME: Cosmos-Staging
  IDLE_MINUTES: 120

jobs:
  stop_job:
    runs-on: ubuntu-latest
    steps:
      - name: sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: stop the staging server if asked, or if it has been idle
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
        run: |
          state=$(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)
          echo "staging server is: $state"
          if [ "$state" != "PowerState/running" ]; then echo "nothing to do"; exit 0; fi

          # never stop in the middle of a deploy
          busy=0
          for repo in CosmosTUe/Cosmos CosmosTUe/Commonroom; do
            n=$(gh api "repos/$repo/actions/workflows/staging-deploy.yml/runs?status=in_progress" --jq '.total_count')
            q=$(gh api "repos/$repo/actions/workflows/staging-deploy.yml/runs?status=queued" --jq '.total_count')
            busy=$((busy + n + q))
          done
          if [ "$busy" -gt 0 ]; then echo "a staging deploy is running; leaving staging on"; exit 0; fi

          if [ "$TRIGGER" != "workflow_dispatch" ]; then
            # last activity: when the server was started, or the last staging deploy in either repo.
            # If any time can't be read, leave staging on rather than risk stopping it mid-use.
            to_epoch() { date -d "$1" +%s 2>/dev/null || true; }
            started=$(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "instanceView.statuses[?code=='ProvisioningState/succeeded'].time | [0]" -o tsv)
            last=$(to_epoch "$started")
            if ! [[ "$last" =~ ^[0-9]+$ ]]; then echo "could not read when staging was started; leaving it on"; exit 0; fi
            for repo in CosmosTUe/Cosmos CosmosTUe/Commonroom; do
              t=$(to_epoch "$(gh api "repos/$repo/actions/workflows/staging-deploy.yml/runs?per_page=1" --jq '.workflow_runs[0].updated_at // empty')")
              if [[ "$t" =~ ^[0-9]+$ ]] && [ "$t" -gt "$last" ]; then last=$t; fi
            done
            idle=$(( ($(date +%s) - last) / 60 ))
            echo "last activity: $(date -u -d "@$last" '+%Y-%m-%d %H:%M UTC') ($idle minutes ago)"
            if [ "$idle" -lt "$IDLE_MINUTES" ]; then echo "still in use; leaving staging on"; exit 0; fi
          fi

          echo "stopping the staging server"
          az vm deallocate -g "$RESOURCE_GROUP" -n "$VM_NAME"
          echo "staging server is now: $(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)"
