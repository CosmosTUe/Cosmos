# Every hook uses the tool version from Pipfile.lock, the same version CI checks with
repos:
- repo: local
  hooks:
  - id: flake8
    name: flake8
    entry: pipenv run flake8
    language: system
    types: [python]
  - id: black
    name: black
    entry: pipenv run black
    language: system
    types: [python]
  - id: isort
    name: isort (python)
    entry: pipenv run isort
    language: system
    types: [python]
