{# Ticket widget for an event's pretix shop (Event.pretix_shop). Embed code as given by pretix, English widget; links are only accepted on pretix.cosmostue.nl (apps/events/pretix.py). #}
<link rel="stylesheet" type="text/css" href="{{ shop }}widget/v1.css">
<script type="text/javascript" src="https://pretix.cosmostue.nl/widget/v1.en.js" async></script>
<pretix-widget event="{{ shop }}" single-item-select="button"></pretix-widget>
<noscript>
    <div class="pretix-widget">
        <div class="pretix-widget-info-message">
            JavaScript is disabled in your browser. To access our ticket shop without JavaScript, please
            <a target="_blank" rel="noopener" href="{{ shop }}">click here</a>.
        </div>
    </div>
</noscript>
