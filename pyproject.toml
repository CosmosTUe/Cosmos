[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.git          # root of the project
    | \.tox          # unit test results
    | \.venv         # python virtual environment
  )/
)
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 120

[build-system]
requires = [
    "setuptools >= 84.1.0",
    "setuptools_scm >= 2.0.0, <3"
]
build-backend = "setuptools.build_meta"